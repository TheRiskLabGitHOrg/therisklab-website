# therisklab.ai - Netlify configuration
#
# The therisklab.co -> therisklab.ai permanent 301 is NOT configured here, and
# cannot be. Host-based `from` patterns never match: Netlify canonicalises the
# request to the site's primary domain before the redirect engine runs, and before
# edge functions run. A .co request never reaches this site at all.
#
# It is handled by a separate Netlify project, `therisklab-co-redirect`, which holds
# the domain and a single rule: /*  https://therisklab.ai/:splat  301!
# Confirmed 301 by curl on 8 Sep 2026. See claude_domain-migration-301-fix-how-to-apply.md.

[[redirects]]
  from = "/insights.html"
  to = "/insights/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301
  force = true

[[redirects]]
  from = "/clients"
  to = "/clients.html"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    # 1 hour hard cache, then revalidate. Was max-age=2592000 (30 days) with no
    # revalidation, which meant replacing an asset in place under the same
    # filename left returning visitors on the old file for up to a month.
    # Netlify sends ETags, so revalidation is a cheap 304.
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/style.css"
  [headers.values]
    # must-revalidate matters here. style.css changes in lockstep with the markup,
    # so a cached copy renders new HTML against old rules — which is exactly what
    # happened on 15 Sep when the ?v= string was not bumped. Netlify sends ETags,
    # so revalidation costs a 304.
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Baseline security headers for every response. No Content-Security-Policy
    # yet: the pages use inline scripts and Google Fonts, so a CSP needs its own
    # tested round. frame-ancestors is set on its own to block framing.
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
